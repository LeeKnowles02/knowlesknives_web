<div class="admin-login">
  <div class="admin-login__card">
    <div class="admin-login__brand">
      <span class="admin-login__mark">KK</span>
      <h1>Knowles Admin</h1>
      <p>Sign in to manage knives, services, and enquiries.</p>
    </div>

    @if (errorMessage()) {
      <div class="admin-alert admin-alert--error">{{ errorMessage() }}</div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="admin-login__form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
        @if (isInvalid('email')) {
          <span class="error">Please enter a valid email.</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
        @if (isInvalid('password')) {
          <span class="error">Please enter your password.</span>
        }
      </div>

      <button
        type="submit"
        class="admin-btn admin-btn--primary admin-login__submit"
        [disabled]="loading()"
      >
        {{ loading() ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>

    <a routerLink="/" class="admin-login__back">← Back to Site</a>
  </div>
</div>
