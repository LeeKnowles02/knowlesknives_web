<div class="select-field" [class.select-field--open]="open()" [class.select-field--disabled]="disabled">
  <button
    type="button"
    class="select-field__trigger"
    [id]="id || null"
    [attr.aria-label]="ariaLabel || null"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    [disabled]="disabled"
    (click)="toggle()"
  >
    <span class="select-field__value">{{ displayLabel() }}</span>
  </button>

  @if (open()) {
    <ul class="select-field__menu" role="listbox" [attr.aria-labelledby]="id || null">
      @if (allowEmpty) {
        <li role="presentation">
          <button
            type="button"
            class="select-field__option"
            role="option"
            [class.select-field__option--selected]="isSelected('')"
            [attr.aria-selected]="isSelected('')"
            (click)="choose('')"
          >
            {{ emptyLabel }}
          </button>
        </li>
      }

      @for (option of options; track option.value) {
        <li role="presentation">
          <button
            type="button"
            class="select-field__option"
            role="option"
            [class.select-field__option--selected]="isSelected(option.value)"
            [attr.aria-selected]="isSelected(option.value)"
            (click)="choose(option.value)"
          >
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
