<div class="page-hero">
  <div class="container">
    <h1 class="page-hero__title">Our Knives</h1>

    <p class="page-hero__subtitle">
      Handcrafted blades — enquire about availability. No online payments.
    </p>
  </div>
</div>

<section class="section section--cream">
  <div class="container">
    <div class="filters">
      <div class="filters__group">
        <label for="search">Search</label>

        <input
          id="search"
          type="text"
          placeholder="Search knives..."
          [ngModel]="search()"
          (ngModelChange)="search.set($event); onFilterChange()"
        />
      </div>

      <div class="filters__group">
        <label for="category">Category</label>

        <app-select-field
          id="category"
          emptyLabel="All Categories"
          [options]="categoryOptions()"
          [ngModel]="category()"
          (ngModelChange)="category.set($event); onFilterChange()"
        />
      </div>

      <div class="filters__group">
        <label for="availability">Availability</label>

        <app-select-field
          id="availability"
          emptyLabel="All"
          [options]="availabilityOptions"
          [ngModel]="availability()"
          (ngModelChange)="availability.set($event); onFilterChange()"
        />
      </div>

      <div class="filters__group">
        <label for="maxPrice">Max Price (R)</label>

        <input
          id="maxPrice"
          type="number"
          placeholder="Any"
          [ngModel]="maxPrice()"
          (ngModelChange)="maxPrice.set($event ? +$event : null); onFilterChange()"
        />
      </div>

      <button
        type="button"
        class="btn btn--outline-dark btn--small filters__clear"
        (click)="clearFilters()"
      >
        Clear
      </button>
    </div>

    @if (loading()) {
      <p class="page-state">Loading knives…</p>
    } @else if (error()) {
      <p class="page-state page-state--error">{{ error() }}</p>
    } @else if (knives().length === 0) {
      <p class="page-state">No knives found.</p>
    } @else {
      <div class="grid grid--3 knives-grid">
        @for (knife of knives(); track knife.id) {
          <app-knife-card [knife]="knife" />
        }
      </div>
    }
  </div>
</section>
